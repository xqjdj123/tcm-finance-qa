<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问数 · 医药上市公司财报分析平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 34 34" width="34" height="34">
          <rect width="34" height="34" rx="11" fill="#1A6B3C"/>
          <path d="M11 21.5v-5M17 21.5v-9M23 21.5v-3.5" stroke="#FFFFFF"
                stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">智能问数</span>
        <span class="brand-sub">医药上市公司财报分析平台</span>
      </span>
    </div>

    <section class="side-block">
      <h2 class="side-label">数据范围</h2>
      <div class="scope-card">
        <div class="scope-cell">
          <span class="scope-num">70</span>
          <span class="scope-cap">家医药上市公司</span>
        </div>
        <div class="scope-cell">
          <span class="scope-num">4+</span>
          <span class="scope-cap">个年报年度</span>
        </div>
        <div class="scope-cell">
          <span class="scope-num">4</span>
          <span class="scope-cap">张财务报表</span>
        </div>
        <div class="scope-cell">
          <span class="scope-num">4359</span>
          <span class="scope-cap">条研报语料</span>
        </div>
      </div>
    </section>

    <section class="side-block side-grow">
      <h2 class="side-label">快捷问题</h2>
      <div class="quick-list" id="quickList"></div>
    </section>

    <button class="status-pill" id="statusPill" type="button" title="点击重新检测依赖">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">正在检测依赖…</span>
    </button>
  </aside>

  <!-- ==================== 主区域 ==================== -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <!-- 抽屉入口：仅 ≤900px 显示（侧栏在该断点改为可唤出的抽屉，第三批 ⑭） -->
        <button class="drawer-btn" id="drawerBtn" type="button"
                aria-label="打开侧栏" aria-expanded="false" aria-controls="sidebar">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path d="M2.5 5h13M2.5 9h13M2.5 13h13" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="conv-text">
          <h1 class="conv-title" id="convTitle">新建会话</h1>
          <p class="conv-meta" id="convMeta">尚未提问 · 支持多轮追问，30 分钟内保持上下文</p>
        </div>
      </div>
      <div class="topbar-right">
        <a class="btn" href="/quality" target="_blank" rel="noopener">数据质量看板</a>
        <button class="btn btn-ghost" id="clearBtn" type="button">清空会话</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="welcome" id="welcome">
        <span class="welcome-mark">问</span>
        <h2>用一句话问财报</h2>
        <p>基于 70 家医药上市公司的四张报表与 4359 条研报语料，支持排名、趋势、对比、归因四类问题。每条回答都附 SQL 溯源、研报参考与完整推理链路，数字可核对。</p>
        <div class="welcome-btns" id="welcomeBtns"></div>
      </div>
      <div class="chat" id="chat"></div>
    </div>

    <div class="composer">
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="输入问题，例如「2025Q3 营收前五的中药企业」"></textarea>
        <button class="send" id="send" type="button" aria-label="发送" title="发送">
          <svg class="ico-send" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 9h11M10 4.5L14.5 9 10 13.5" stroke="#FFFFFF" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="ico-stop" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <rect x="5" y="5" width="8" height="8" rx="1.6" fill="#FFFFFF"/>
          </svg>
        </button>
      </div>
      <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 会话 30 分钟内保持上下文</p>
    </div>
  </main>

  <!-- 抽屉遮罩：≤900px 抽屉打开时可见，点击关闭（第三批 ⑭） -->
  <div class="drawer-mask" id="drawerMask"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="图表放大">
  <img id="lightboxImg" alt="图表放大预览">
</div>

<script src="/static/script.js"></script>
</body>
</html>
